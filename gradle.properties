org.gradle.jvmargs=-Xmx1536m
org.gradle.daemon=true
org.gradle.parallel=false
# Disabled deliberately: Gradle cached a silently-degraded neoFormDecompile output and kept
# restoring it. Its cache key does not cover decompiler memory. NeoGradle has its own cache
# (~/.gradle/caches/ng_execute) which still covers the expensive steps. See NOTES.md.
org.gradle.caching=false
org.gradle.configuration-cache=true

# Decompiler is a FORKED jvm, so its heap adds to the daemon heap.
# Do NOT cap maxMemory below ~3g: Vineflower OOMs inside the Blocks.java static initializer,
# emits a "$VF: Couldn.t be decompiled" stub, exits 0, and the NeoForge patches then fail to
# apply. See NOTES.md. Threads are capped instead, which costs speed but not correctness.
neogradle.subsystems.decompiler.maxMemory=4g
neogradle.subsystems.decompiler.maxThreads=2

# Parchment mappings layered over Mojang official.
neogradle.subsystems.parchment.minecraftVersion=1.21.1
neogradle.subsystems.parchment.mappingsVersion=2024.11.17

# Environment
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.251
neo_version_range=[21.1.0,)
loader_version_range=[4,)

